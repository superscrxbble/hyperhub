<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH | Partners</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400&display=swap" rel="stylesheet"> <!-- Add Nunito font -->
    <style>
        body {
            text-align: center;
            margin-top: 50px;
            color: #FF00FF; /* Text color */
            background-color: #303030; /* Background color */
            font-family: 'Nunito', sans-serif; /* Set font to Nunito */
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #FF00FF; /* Button border color
            background-color: transparent; /* Make button background transparent */
            color: #FF00FF; /* Button text color */
            transition: background-color 0.3s, color 0.3s, transform 0.3s; /* Smooth transition */
        }
        button:hover {
            background-color: #FF00FF; /* Background color on hover */
            color: #303030; /* Text color on hover */
            transform: scale(1.1); /* Enlarge button on hover */
        }
    </style>
    
    <button onclick="window.history.back()" style="position: absolute; top: 20px; right: 20px;">Back</button>
</head>
<body>


<a href="https://central.soloo.fun">

</body>
</html>
